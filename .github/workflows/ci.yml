name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.2.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # --- Node -----------------------------------------------------------
      # tests/money_mask.test.js is pure Node stdlib; --ignore-scripts skips
      # the Electron binary download, which the test does not need.
      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Node tests
        run: npm test

      # --- Python -------------------------------------------------------------
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Byte-compile every .py
        run: python -m compileall -q server.py viewer.py languages.py tests

      - name: Python tests
        run: python -m pytest

      # Was continue-on-error while the initial 6 findings were triaged and
      # fixed; now blocking. Rule set (ruff.toml) is still deliberately
      # narrow (E9 + pyflakes) — widen it deliberately, not by accident.
      - name: Lint (ruff)
        run: python -m ruff check --output-format github .
