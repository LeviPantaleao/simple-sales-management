name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The only test in the repo: tests/money_mask.test.js (pure Node,
      # standard library only — no dependency install needed).
      - name: Run tests
        run: npm test
